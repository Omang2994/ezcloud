<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EzCloud</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect x=%274%27 y=%274%27 width=%2756%27 height=%2756%27 rx=%2714%27 fill=%27white%27 stroke=%27black%27 stroke-width=%276%27/%3E%3Ctext x=%2732%27 y=%2743%27 font-family=%27Segoe UI,Arial,sans-serif%27 font-size=%2730%27 font-weight=%27700%27 fill=%27black%27 text-anchor=%27middle%27%3EEz%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: quiet sidebar + reading column on desktop; on phones a slim top bar and a bottom tab bar.
   Warm paper neutrals, serif page titles, green as the only accent. */
:root {
  --bg: #F7F6F2; --side: #EFEDE6; --surface: #FFFFFF; --surface-2: #F2F0EA; --line: #E4E0D6; --line-2: #D6D1C4;
  --ink: #1F1E1B; --ink-2: #57544C; --muted: #8A867B;
  --accent: #1F1E1B; --accent-soft: #EAE7DF; --on-accent: #FFFFFF;
  --ok: #1C7A47; --ok-soft: #E2F0E7; --warn: #A15C07; --warn-soft: #F8ECD8; --bad: #B4232F; --bad-soft: #F8E1E2;
    --f-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --r: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1D1C1A; --side: #181715; --surface: #262522; --surface-2: #2E2C29; --line: #36342F; --line-2: #45423C;
  --ink: #ECE9E2; --ink-2: #B8B3A8; --muted: #8C877C;
  --accent: #ECE9E2; --accent-soft: #34322E; --on-accent: #1D1C1A;
  --ok: #5FC98C; --ok-soft: #1F3428; --warn: #E3A54A; --warn-soft: #3A2C16; --bad: #F07A80; --bad-soft: #3D1F22;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1D1C1A; --side: #181715; --surface: #262522; --surface-2: #2E2C29; --line: #36342F; --line-2: #45423C;
  --ink: #ECE9E2; --ink-2: #B8B3A8; --muted: #8C877C;
  --accent: #ECE9E2; --accent-soft: #34322E; --on-accent: #1D1C1A;
  --ok: #5FC98C; --ok-soft: #1F3428; --warn: #E3A54A; --warn-soft: #3A2C16; --bad: #F07A80; --bad-soft: #3D1F22;
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1, h2 { font-family: var(--f-display); font-weight: 500; letter-spacing: -0.01em; }
h3 { font-size: 15px; font-weight: 600; }
button, input, select { font: inherit; color: inherit; }
.mono { font-family: var(--f-mono); font-size: 0.84em; }
.muted { color: var(--muted); }

/* controls */
.btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 9px; padding: 7px 14px; cursor: pointer; font-weight: 600; font-size: 15px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select { width: 100%; border: 1px solid var(--line-2); background: var(--surface); border-radius: 9px; padding: 9px 12px; }
input:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
label { display: grid; gap: 5px; font-weight: 600; font-size: 14px; color: var(--ink-2); }
.msg { min-height: 22px; font-weight: 600; font-size: 14px; }
.msg.bad { color: var(--bad); } .msg.ok { color: var(--ok); }
.link { border: 0; background: none; color: var(--accent); font-weight: 600; cursor: pointer; padding: 0; justify-self: start; }

.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: var(--ink); letter-spacing: -0.01em; }
.brand i { width: 28px; height: 28px; border-radius: 8px; background: transparent; border: 2px solid var(--ink); display: grid; place-items: center; color: var(--ink); font-weight: 700; font-style: normal; font-size: 13px; }

/* login */
#login { min-height: 100vh; display: grid; place-items: center; padding-block: 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.login-box { width: min(400px, 100%); display: grid; gap: 16px; }
.login-box h1 { font-size: 30px; }
.login-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: grid; gap: 14px; }
.pw { position: relative; }
.pw input { padding-right: 46px; }
.pw button { position: absolute; right: 3px; bottom: 3px; height: 34px; width: 38px; border: 0; background: transparent; cursor: pointer; color: var(--muted); border-radius: 7px; display: grid; place-items: center; }
.pw button:hover { color: var(--ink); }

/* shell */
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--side); border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 22px;
  padding: calc(env(safe-area-inset-top, 0px) + 18px) 14px 18px max(14px, env(safe-area-inset-left, 0px)); }
.side .brand { padding: 2px 8px; }
.tabs { display: grid; gap: 2px; }
.tab { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 8px 10px; border-radius: 9px; cursor: pointer; font-weight: 500; color: var(--ink-2); text-align: left; font-size: 15px; }
.tab svg { width: 18px; height: 18px; flex: none; }
.tab:hover { background: var(--surface-2); color: var(--ink); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--accent); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
.me { margin-top: auto; display: grid; gap: 8px; padding: 12px 8px 0; border-top: 1px solid var(--line); }
.who { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.me .btn { justify-self: start; }

main { padding-block: calc(env(safe-area-inset-top, 0px) + 34px) 70px;
  padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
.page { max-width: 1080px; margin: 0 auto; display: grid; gap: 24px; }
.page-head h1 { font-size: 34px; line-height: 1.15; }
.page-head p { margin: 6px 0 0; color: var(--ink-2); }

/* summary: one quiet line of numbers */
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.stat { padding: 14px 18px; border-left: 1px solid var(--line); min-width: 0; }
.stat:first-child { border-left: 0; }
.stat span { font-size: 13px; color: var(--muted); font-weight: 600; }
.stat b { display: block; font-size: 26px; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }

.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.toolbar input { flex: 1 1 240px; max-width: 360px; }
.toolbar select { flex: 0 1 190px; }
.toolbar .grow { flex: 1; }

/* units */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 14px; align-content: start; cursor: pointer; text-align: left; }
.card:hover { border-color: var(--line-2); box-shadow: 0 2px 10px rgb(0 0 0 / .05); }
.card-head { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.card-head h3 { font-size: 17px; }
.card-head .sub { font-size: 14px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 99px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.off { background: var(--surface-2); color: var(--muted); }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line); padding-top: 12px; }
.fact { min-width: 0; padding-right: 8px; }
.fact small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
.fact b { font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 600; }
.alert { font-size: 14px; font-weight: 600; color: var(--bad); background: var(--bad-soft); border-radius: 9px; padding: 8px 12px; }
.alert.warn { color: var(--warn); background: var(--warn-soft); }
.card .foot { font-size: 12px; }
.empty { background: transparent; border: 1px dashed var(--line-2); border-radius: var(--r); padding: 32px; text-align: center; color: var(--ink-2); }

/* sheet */
.sheet-bg { position: fixed; inset: 0; background: rgb(20 18 14 / .4); z-index: 20; }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 100%); background: var(--bg); z-index: 21; overflow-y: auto; border-left: 1px solid var(--line);
  padding: calc(env(safe-area-inset-top, 0px) + 22px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 32px) 20px; display: grid; gap: 16px; align-content: start; }
.sheet-head { display: flex; gap: 12px; align-items: start; justify-content: space-between; }
.sheet-head h2 { font-size: 28px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 12px; min-width: 0; }
.panel .facts { border-top: 0; padding-top: 0; row-gap: 12px; }
.form-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
td.wrap-text { white-space: normal; min-width: 220px; }
.bars { display: flex; align-items: end; gap: 4px; height: 120px; padding-top: 8px; border-bottom: 1px solid var(--line); }
.bars div { flex: 1; min-width: 6px; background: var(--accent); border-radius: 4px 4px 0 0; opacity: .85; }
.bars div:hover { opacity: 1; }
.bars div.zero { background: var(--line); height: 2px !important; }
.bar-labels { display: flex; gap: 4px; font-size: 11px; color: var(--muted); }
.bar-labels span { flex: 1; text-align: center; min-width: 6px; overflow: hidden; }

/* phones: top bar + bottom tab bar */
@media (max-width: 860px) {
  .shell { display: block; }
  .side { position: sticky; top: 0; z-index: 6; height: auto; flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; border-right: 0; border-bottom: 1px solid var(--line);
    padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
  .side .brand { padding: 0; }
  .me { margin: 0; border: 0; padding: 0; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .who { max-width: 44vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .me .btn { padding: 5px 10px; font-size: 14px; white-space: nowrap; }
  .who { display: none; }
  @media (min-width: 520px) { .who { display: block; } }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; display: flex; background: var(--side); border-top: 1px solid var(--line);
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 6px) max(8px, env(safe-area-inset-left, 0px)); }
  .tab { flex: 1; flex-direction: column; gap: 2px; font-size: 11px; padding: 6px 2px; text-align: center; }
  .tab[aria-selected="true"] { box-shadow: none; background: var(--accent-soft); }
  main { padding-block: 20px calc(env(safe-area-inset-bottom, 0px) + 90px);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .page { gap: 18px; }
  .page-head h1 { font-size: 28px; }
  .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat:nth-child(3) { border-left: 0; }
  .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
  .toolbar input, .toolbar select { max-width: none; flex: 1 1 100%; }
  .form-row { grid-template-columns: 1fr; }
  .grid { grid-template-columns: 1fr; }
  .sheet { border-left: 0; }
}
@media (prefers-reduced-motion: no-preference) { .card, .tab, .btn { transition: background .15s, border-color .15s, box-shadow .15s; } }
</style>
</head>
<body>

<!-- ───── Login ───── -->
<section id="login" hidden>
  <form class="login-box" id="loginForm">
    <div class="brand"><i>Ez</i>EzCloud</div>
    <h1>Welcome back</h1>
    <p class="muted" style="margin:-8px 0 0">Your EzPrint units: online or offline, paper, printer and sales.</p>
    <div class="login-card">
    <label>Email <input id="email" type="email" autocomplete="email" required></label>
    <label>Password <span class="pw"><input id="password" type="password" autocomplete="current-password" required minlength="6"><button type="button" class="eye" aria-label="Show password"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span></label>
    <button class="link" id="forgotBtn" type="button">Forgot password?</button>
    <div class="msg" id="loginMsg"></div>
    <button class="btn primary" id="loginBtn" type="submit">Log in</button>
    <button class="btn" id="signupBtn" type="button">Create account</button>
    </div>
  </form>
  <form class="login-box" id="newPwForm" hidden>
    <div class="brand"><i>Ez</i>EzCloud</div>
    <h1>Set a new password</h1>
    <label>New password <span class="pw"><input id="newPassword" type="password" autocomplete="new-password" required minlength="6"><button type="button" class="eye" aria-label="Show password"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span></label>
    <div class="msg" id="newPwMsg"></div>
    <button class="btn primary" type="submit">Save new password</button>
  </form>
</section>

<!-- ───── App ───── -->
<div id="app" class="shell" hidden>
  <aside class="side">
    <div class="brand"><i>Ez</i>EzCloud</div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" data-tab="units" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="7" rx="1"/><rect x="3" y="10" width="18" height="8" rx="2"/><path d="M7 18v3h10v-3"/></svg><span>Units</span></button>
      <button class="tab dev" role="tab" data-tab="clients" aria-selected="false" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21v-1a6 6 0 0 1 12 0v1"/><circle cx="9" cy="8" r="4"/><path d="M17 11a3 3 0 1 0 0-6M21 21v-1a5 5 0 0 0-3-4.6"/></svg><span>Clients</span></button>
      <button class="tab dev" role="tab" data-tab="accounts" aria-selected="false" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2.5"/><path d="M5.5 16a3.5 3.5 0 0 1 7 0M15 10h3M15 14h3"/></svg><span>Accounts</span></button>
      <button class="tab" role="tab" data-tab="unbind" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15l-2 2a3.5 3.5 0 0 1-5-5l3-3a3.5 3.5 0 0 1 5 0M15 9l2-2a3.5 3.5 0 0 1 5 5l-3 3a3.5 3.5 0 0 1-5 0M3 3l18 18"/></svg><span>Unbind</span></button>
    </nav>
    <div class="me"><span class="who" id="who"></span><button class="btn" id="logoutBtn">Log out</button></div>
  </aside>

  <main>
   <div class="page">
    <header class="page-head"><h1 id="pageTitle">Units</h1><p id="pageSub">Every EzPrint machine, live.</p></header>
    <!-- Units -->
    <section id="tab-units" style="display:grid;gap:20px">
      <div class="summary" id="summary"></div>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search name, client, chip ID" aria-label="Search units">
        <select id="filter" aria-label="Show" style="max-width:200px">
          <option value="all">All units</option>
          <option value="problem">Needs attention</option>
          <option value="offline">Offline</option>
        </select>
        <span class="grow"></span>
        <span class="muted" id="updated" style="font-size:14px"></span>
        <button class="btn" id="refreshBtn">Refresh</button>
      </div>
      <div class="grid" id="units"></div>
    </section>

    <!-- Clients (developer) -->
    <section id="tab-clients" hidden style="display:grid;gap:16px">
      <form class="panel" id="clientForm">
        <h3>Add client</h3>
        <div class="form-row">
          <label>Name <input id="cName" required placeholder="Juan's Printshop"></label>
          <label>Phone <input id="cPhone" placeholder="0917 000 0000"></label>
        </div>
        <div><button class="btn primary" type="submit">Add client</button> <span class="msg" id="clientMsg"></span></div>
      </form>
      <div class="panel"><h3>Clients</h3><div class="table-wrap"><table id="clientsTable"></table></div></div>
    </section>

    <!-- Accounts (developer) -->
    <section id="tab-accounts" hidden style="display:grid;gap:16px">
      <div class="panel">
        <p class="muted" style="margin:0">A new account sees nothing until you link it to a client here.</p>
        <div class="table-wrap"><table id="accountsTable"></table></div>
      </div>
    </section>

    <!-- Unbind requests -->
    <section id="tab-unbind" hidden style="display:grid;gap:16px">
      <div class="panel">
        <p class="muted" style="margin:0" id="unbindHint"></p>
        <div class="table-wrap"><table id="unbindTable"></table></div>
      </div>
    </section>
   </div>
  </main>
</div>

<!-- ───── Unit sheet ───── -->
<div class="sheet-bg" id="sheetBg" hidden></div>
<aside class="sheet" id="sheet" hidden aria-modal="true" role="dialog"></aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// EzCloud website. Talks to Supabase with the logged-in person's rights:
// the database itself (RLS) decides what each person may see. This key is public on purpose.
const SUPABASE_URL = "https://mxwrkjjbnwkwnodadfua.supabase.co";
const SUPABASE_KEY = "sb_publishable_1x6p63xQOzsOy7P6hQxImA_Tz42E6xF";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const peso = c => "₱" + (Number(c || 0) / 100).toLocaleString("en-PH", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const pesoN = n => "₱" + Number(n || 0).toLocaleString("en-PH", { maximumFractionDigits: 2 });
const dt = s => s ? new Date(s).toLocaleString("en-PH", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "—";
function ago(s) {
  if (!s) return "never";
  const m = Math.round((Date.now() - new Date(s)) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  const h = Math.round(m / 60);
  if (h < 48) return h + " h ago";
  return Math.round(h / 24) + " days ago";
}

const state = { me: null, dev: false, units: [], clients: [], profiles: [] };
let recovering = location.hash.includes("type=recovery");   // opened from the reset email

// ───── Login ─────
async function boot() {
  const { data: { session } } = await db.auth.getSession();
  if (recovering) { $("#login").hidden = false; $("#loginForm").hidden = true; $("#newPwForm").hidden = false; }
  else session ? start(session) : showLogin();
  db.auth.onAuthStateChange((ev, s) => {
    if (ev === "SIGNED_OUT") showLogin();
    if (ev === "PASSWORD_RECOVERY") { recovering = true; $("#app").hidden = true; $("#login").hidden = false; $("#loginForm").hidden = true; $("#newPwForm").hidden = false; return; }
    if (ev === "SIGNED_IN" && s && !state.me && !recovering) start(s);
  });
}
function showLogin() { state.me = null; $("#app").hidden = true; $("#login").hidden = false; }

$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  setMsg("loginMsg", "Logging in…");
  const { data, error } = await db.auth.signInWithPassword({ email: $("#email").value.trim(), password: $("#password").value });
  if (error) return setMsg("loginMsg", error.message === "Invalid login credentials" ? "Wrong email or password." : error.message, "bad");
  setMsg("loginMsg", "");
  start(data.session);
});
$("#signupBtn").addEventListener("click", async () => {
  const email = $("#email").value.trim(), password = $("#password").value;
  if (!email || password.length < 6) return setMsg("loginMsg", "Type your email and a password (6 or more characters) first.", "bad");
  const { data, error } = await db.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } });
  if (error) return setMsg("loginMsg", error.message, "bad");
  if (data.session) return start(data.session);
  setMsg("loginMsg", "Account made. Open the email we sent to confirm it, then log in.", "ok");
});
$("#logoutBtn").addEventListener("click", () => db.auth.signOut());

// Show / hide password (the eye)
document.querySelectorAll(".pw .eye").forEach(b => b.addEventListener("click", () => {
  const input = b.parentElement.querySelector("input");
  const show = input.type === "password";
  input.type = show ? "text" : "password";
  b.setAttribute("aria-label", show ? "Hide password" : "Show password");
  b.style.color = show ? "var(--accent)" : "";
}));

// Forgot password: email with a link back here, then a form for the new password
$("#forgotBtn").addEventListener("click", async () => {
  const email = $("#email").value.trim();
  if (!email) return setMsg("loginMsg", "Type your email first, then tap Forgot password.", "bad");
  const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  setMsg("loginMsg", error ? error.message : "Check your email for the reset link (look in Spam too).", error ? "bad" : "ok");
});
$("#newPwForm").addEventListener("submit", async e => {
  e.preventDefault();
  const { error } = await db.auth.updateUser({ password: $("#newPassword").value });
  if (error) return setMsg("newPwMsg", error.message, "bad");
  recovering = false;
  $("#newPwForm").hidden = true; $("#loginForm").hidden = false;
  history.replaceState(null, "", location.pathname);
  const { data: { session } } = await db.auth.getSession();
  session ? start(session) : setMsg("loginMsg", "Password saved. Log in with it now.", "ok");
});
function setMsg(id, text, kind = "") { const el = $("#" + id); el.textContent = text; el.className = "msg " + kind; }

async function start(session) {
  state.me = session.user;
  $("#login").hidden = true; $("#app").hidden = false;
  const { data: prof } = await db.from("profiles").select("*").eq("user_id", session.user.id).maybeSingle();
  state.dev = prof?.role === "developer";
  $("#who").textContent = (session.user.email || "") + (state.dev ? " · developer" : "");
  document.querySelectorAll(".tab.dev").forEach(t => t.hidden = !state.dev);
  $("#unbindHint").textContent = state.dev
    ? "Approve after you unbind the key in Firebase (deviceId cleared). The unit locks itself on its next online check."
    : "Ask the developer to unbind a license (for example when moving it to a new coin slot).";
  await loadAll();
}

// ───── Tabs ─────
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === t));
  ["units", "clients", "accounts", "unbind"].forEach(n => $("#tab-" + n).hidden = n !== t.dataset.tab);
  const head = { units: ["Units", "Every EzPrint machine, live."], clients: ["Clients", "The shops that own your units."],
    accounts: ["Accounts", "Who can log in, and which shop they see."], unbind: ["Unbind requests", "Moving a license to a new coin slot."] }[t.dataset.tab];
  $("#pageTitle").textContent = head[0]; $("#pageSub").textContent = head[1];
  window.scrollTo(0, 0);
  if (t.dataset.tab === "clients") renderClients();
  if (t.dataset.tab === "accounts") renderAccounts();
  if (t.dataset.tab === "unbind") renderUnbind();
}));

// ───── Data ─────
async function loadAll() {
  const [u, c, p] = await Promise.all([
    db.from("unit_overview").select("*").order("created_at"),
    db.from("clients").select("*").order("name"),
    state.dev ? db.from("profiles").select("*").order("created_at") : Promise.resolve({ data: [] })
  ]);
  if (u.error) { $("#units").innerHTML = `<div class="empty">Couldn't load units: ${esc(u.error.message)}</div>`; return; }
  state.units = u.data || []; state.clients = c.data || []; state.profiles = p.data || [];
  $("#updated").textContent = "Updated " + new Date().toLocaleTimeString("en-PH", { hour: "numeric", minute: "2-digit" });
  renderUnits();
}
$("#refreshBtn").addEventListener("click", loadAll);
$("#search").addEventListener("input", renderUnits);
$("#filter").addEventListener("change", renderUnits);
setInterval(() => { if (state.me && !document.hidden) loadAll(); }, 5 * 60 * 1000);

const clientName = id => state.clients.find(c => c.id === id)?.name || "";
const unitName = u => u.name || u.status?.name || u.device_id;

/** What needs attention on one unit, worst first. */
function issues(u) {
  const s = u.status || {}, out = [];
  if (!u.online) out.push({ kind: "bad", text: "Offline · last report " + ago(u.last_seen) });
  for (const k of ["printerColor", "printerBw"]) {
    const p = s[k];
    if (p && !p.ok) out.push({ kind: "bad", text: (k === "printerBw" ? "B&W printer: " : "Printer: ") + p.detail });
    else if (p?.warning) out.push({ kind: "warn", text: p.warning });
  }
  if (s.paper !== undefined && s.paper <= 0) out.push({ kind: "bad", text: "Out of paper" });
  else if (s.paper !== undefined && s.paper <= (s.paperLowAt ?? 20)) out.push({ kind: "warn", text: `Paper low · ${s.paper} sheets` });
  if (s.coinSlot === "offline") out.push({ kind: "bad", text: "Coin slot not connected" });
  if (s.license && !["Active", "NotSetUp"].includes(s.license)) out.push({ kind: "bad", text: "License: " + s.license });
  if (s.serviceWarnAt > 0 && s.pagesSinceService >= s.serviceWarnAt) out.push({ kind: "warn", text: `Ink pad counter ${s.pagesSinceService} pages · reset soon` });
  return out;
}

function renderUnits() {
  const q = $("#search").value.trim().toLowerCase(), f = $("#filter").value;
  const all = state.units;
  const online = all.filter(u => u.online).length;
  const problems = all.filter(u => issues(u).some(i => i.kind === "bad")).length;
  const today = all.reduce((t, u) => t + Number(u.status?.today?.total || 0), 0);
  $("#summary").innerHTML = `
    <div class="stat"><span>Units</span><b>${all.length}</b></div>
    <div class="stat"><span>Online</span><b style="color:var(--ok)">${online}</b></div>
    <div class="stat"><span>Need attention</span><b style="color:${problems ? "var(--bad)" : "var(--ink)"}">${problems}</b></div>
    <div class="stat"><span>Sales today</span><b>${pesoN(today)}</b></div>`;

  const list = all.filter(u => {
    const hay = [unitName(u), u.device_id, clientName(u.client_id), u.location].join(" ").toLowerCase();
    if (q && !hay.includes(q)) return false;
    if (f === "offline") return !u.online;
    if (f === "problem") return issues(u).length > 0;
    return true;
  });

  if (!all.length) {
    $("#units").innerHTML = `<div class="empty" style="grid-column:1/-1">${state.dev
      ? "No units yet. A unit appears here a minute after EzPrint starts with an activated license."
      : "No units linked to your account yet. Ask the developer to link your account to your shop."}</div>`;
    return;
  }
  if (!list.length) { $("#units").innerHTML = `<div class="empty" style="grid-column:1/-1">No units match.</div>`; return; }

  $("#units").innerHTML = list.map(u => {
    const s = u.status || {}, iss = issues(u), bad = iss.some(i => i.kind === "bad");
    const pill = !u.online ? `<span class="pill off">Offline</span>` : bad ? `<span class="pill bad">Problem</span>`
      : iss.length ? `<span class="pill warn">Check</span>` : `<span class="pill ok">Online</span>`;
    const first = iss[0];
    return `<button class="card ${!u.online ? "offline" : bad ? "problem" : ""}" data-unit="${esc(u.id)}">
      <div class="card-head">
        <div><h3>${esc(unitName(u))}</h3>
          <div class="sub">${esc([clientName(u.client_id), u.location].filter(Boolean).join(" · ") || "No client yet")}</div></div>
        ${pill}
      </div>
      <div class="facts">
        <div class="fact"><small>Today</small><b>${pesoN(s.today?.total)}</b></div>
        <div class="fact"><small>Paper</small><b>${s.paper ?? "—"}</b></div>
        <div class="fact"><small>Seen</small><b style="font-size:14px">${esc(ago(u.last_seen))}</b></div>
      </div>
      ${first ? `<div class="alert ${first.kind === "warn" ? "warn" : ""}">${esc(first.text)}${iss.length > 1 ? ` · +${iss.length - 1} more` : ""}</div>` : ""}
      <div class="muted mono foot">${esc(u.device_id)} · v${esc(u.app_version || "?")}</div>
    </button>`;
  }).join("");
  document.querySelectorAll("[data-unit]").forEach(c => c.addEventListener("click", () => openUnit(c.dataset.unit)));
}

// ───── Unit sheet ─────
function closeSheet() { $("#sheet").hidden = true; $("#sheetBg").hidden = true; }
$("#sheetBg").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

async function openUnit(id) {
  const u = state.units.find(x => x.id === id); if (!u) return;
  const s = u.status || {};
  const sheet = $("#sheet");
  sheet.hidden = false; $("#sheetBg").hidden = false;
  sheet.innerHTML = `<div class="sheet-head"><div><h2>${esc(unitName(u))}</h2><div class="muted mono">${esc(u.device_id)}</div></div>
    <button class="btn" id="closeSheet">Close</button></div><div class="panel muted">Loading…</div>`;
  $("#closeSheet").onclick = closeSheet;

  const since = new Date(Date.now() - 14 * 86400000).toISOString();
  const [sales, errs, unb] = await Promise.all([
    db.from("sales").select("*").eq("unit_id", id).gte("at", since).order("at", { ascending: false }).limit(1000),
    db.from("unit_errors").select("*").eq("unit_id", id).order("at", { ascending: false }).limit(50),
    db.from("unbind_requests").select("*").eq("unit_id", id).order("created_at", { ascending: false }).limit(5)
  ]);
  const rows = sales.data || [];

  // last 14 days, money kept per day
  const days = [];
  for (let i = 13; i >= 0; i--) { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i); days.push({ d, c: 0 }); }
  rows.forEach(r => { const t = new Date(r.at); const day = days.find(x => t >= x.d && t < new Date(x.d.getTime() + 86400000)); if (day) day.c += r.paid_c || 0; });
  const max = Math.max(1, ...days.map(x => x.c));
  const total14 = days.reduce((t, x) => t + x.c, 0);

  const printers = ["printerColor", "printerBw"].filter(k => s[k]).map(k => {
    const p = s[k];
    return `<tr><td>${k === "printerBw" ? "B&W" : "Colored"}</td><td>${esc(p.name)}</td>
      <td>${p.ok ? `<span class="pill ok">Ready</span>` : `<span class="pill bad">${esc(p.detail)}</span>`}</td><td>${esc(p.warning || "")}</td></tr>`;
  }).join("");
  const iss = issues(u);
  const pending = (unb.data || []).find(r => r.status === "pending");

  sheet.innerHTML = `
    <div class="sheet-head"><div><h2>${esc(unitName(u))}</h2>
      <div class="muted mono">${esc(u.device_id)} · v${esc(u.app_version || "?")}${u.firmware_version ? " · coin slot fw " + esc(u.firmware_version) : ""}</div></div>
      <button class="btn" id="closeSheet">Close</button></div>

    <div class="panel">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        ${u.online ? `<span class="pill ok">Online</span>` : `<span class="pill off">Offline</span>`}
        <span class="muted">Last report ${esc(dt(u.last_seen))} (${esc(ago(u.last_seen))}) · reports every ${u.effective_report_minutes} min</span>
      </div>
      ${iss.length ? iss.map(i => `<div class="alert ${i.kind === "warn" ? "warn" : ""}">${esc(i.text)}</div>`).join("") : `<div class="muted">Everything looks fine.</div>`}
      <div class="facts">
        <div class="fact"><small>Today</small><b>${pesoN(s.today?.total)}</b></div>
        <div class="fact"><small>Jobs today</small><b>${s.today?.jobs ?? "—"}</b></div>
        <div class="fact"><small>Pages today</small><b>${s.today?.pages ?? "—"}</b></div>
        <div class="fact"><small>Paper left</small><b>${s.paper ?? "—"}</b></div>
        <div class="fact"><small>Ink pad counter</small><b>${s.pagesSinceService ?? "—"}</b></div>
        <div class="fact"><small>Coin slot</small><b style="font-size:14px">${esc(s.coinSlot || "—")}</b></div>
      </div>
      ${printers ? `<div class="table-wrap"><table><tr><th>Printer</th><th>Name</th><th>Status</th><th>Note</th></tr>${printers}</table></div>` : ""}
    </div>

    <div class="panel">
      <h3>Last 14 days · ${peso(total14)}</h3>
      <div class="bars" role="img" aria-label="Money kept per day, last 14 days">
        ${days.map(x => `<div class="${x.c ? "" : "zero"}" style="height:${(x.c / max * 100).toFixed(1)}%" title="${x.d.toLocaleDateString("en-PH", { month: "short", day: "numeric" })}: ${peso(x.c)}"></div>`).join("")}
      </div>
      <div class="bar-labels">${days.map((x, i) => `<span>${i % 2 ? "" : x.d.getDate()}</span>`).join("")}</div>
    </div>

    <div class="panel"><h3>Sales</h3>
      ${rows.length ? `<div class="table-wrap"><table>
        <tr><th>When</th><th>Sale</th><th class="r">Pages</th><th>Status</th><th class="r">Price</th><th class="r">Kept</th><th class="r">Sukli</th></tr>
        ${rows.slice(0, 100).map(r => `<tr><td>${esc(dt(r.at))}</td><td class="mono">${esc(r.sale_id)}</td><td class="r">${r.pages ?? ""}${r.color ? " · color" : ""}</td>
          <td>${esc(r.status)}</td><td class="r">${peso(r.price_c)}</td><td class="r">${peso(r.paid_c)}</td><td class="r">${r.change_c ? peso(r.change_c) : ""}</td></tr>`).join("")}
      </table></div>` : `<div class="muted">No sales in the last 14 days.</div>`}
    </div>

    <div class="panel"><h3>Problems the app logged</h3>
      ${(errs.data || []).length ? `<div class="table-wrap"><table><tr><th>When</th><th>Where</th><th>What</th></tr>
        ${errs.data.map(e => `<tr><td>${esc(dt(e.at))}</td><td>${esc(e.kind)}</td><td class="wrap-text">${esc(e.message)}</td></tr>`).join("")}</table></div>`
        : `<div class="muted">Nothing logged.</div>`}
    </div>

    ${state.dev ? `
    <form class="panel" id="unitForm">
      <h3>Unit settings</h3>
      <div class="form-row">
        <label>Name <input id="uName" value="${esc(u.name || "")}" placeholder="${esc(s.name || "")}"></label>
        <label>Location <input id="uLoc" value="${esc(u.location || "")}" placeholder="Brgy., city"></label>
        <label>Client <select id="uClient"><option value="">No client</option>
          ${state.clients.map(c => `<option value="${c.id}" ${c.id === u.client_id ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select></label>
        <label>Report every (minutes, empty = default) <input id="uMin" type="number" min="5" max="1440" value="${u.report_minutes ?? ""}"></label>
      </div>
      <div class="muted">License key: <span class="mono">${esc(u.license_key || "—")}</span></div>
      <div><button class="btn primary" type="submit">Save</button> <span class="msg" id="unitMsg"></span></div>
    </form>` : `
    <div class="panel"><h3>License</h3>
      ${pending ? `<div class="alert warn">Unbind requested ${esc(dt(pending.created_at))}. Waiting for the developer.</div>`
        : `<label>Reason <input id="ubReason" placeholder="e.g. moving the license to a new coin slot"></label>
           <div><button class="btn" id="ubBtn">Request unbind</button> <span class="msg" id="ubMsg"></span></div>`}
    </div>`}
  `;
  $("#closeSheet").onclick = closeSheet;

  if (state.dev) {
    $("#unitForm").addEventListener("submit", async e => {
      e.preventDefault();
      const min = $("#uMin").value.trim();
      const { error } = await db.from("units").update({
        name: $("#uName").value.trim() || null, location: $("#uLoc").value.trim() || null,
        client_id: $("#uClient").value || null, report_minutes: min ? Number(min) : null
      }).eq("id", id);
      setMsg("unitMsg", error ? error.message : "Saved.", error ? "bad" : "ok");
      if (!error) { await loadAll(); }
    });
  } else if (!pending) {
    $("#ubBtn").addEventListener("click", async () => {
      const { error } = await db.from("unbind_requests").insert({ unit_id: id, requested_by: state.me.id, reason: $("#ubReason").value.trim() || null });
      setMsg("ubMsg", error ? error.message : "Sent. The developer will check it.", error ? "bad" : "ok");
    });
  }
}

// ───── Clients ─────
function renderClients() {
  const count = id => state.units.filter(u => u.client_id === id).length;
  $("#clientsTable").innerHTML = `<tr><th>Name</th><th>Phone</th><th class="r">Units</th><th>Added</th></tr>` +
    (state.clients.map(c => `<tr><td>${esc(c.name)}</td><td>${esc(c.phone || "")}</td><td class="r">${count(c.id)}</td><td>${esc(dt(c.created_at))}</td></tr>`).join("")
      || `<tr><td colspan="4" class="muted">No clients yet.</td></tr>`);
}
$("#clientForm").addEventListener("submit", async e => {
  e.preventDefault();
  const { error } = await db.from("clients").insert({ name: $("#cName").value.trim(), phone: $("#cPhone").value.trim() || null });
  setMsg("clientMsg", error ? error.message : "Added.", error ? "bad" : "ok");
  if (!error) { $("#cName").value = ""; $("#cPhone").value = ""; await loadAll(); renderClients(); }
});

// ───── Accounts ─────
function renderAccounts() {
  $("#accountsTable").innerHTML = `<tr><th>Account</th><th>Role</th><th>Client</th><th></th></tr>` +
    state.profiles.map(p => `<tr><td>${esc(p.display_name || p.user_id)}</td><td>${esc(p.role)}</td>
      <td><select data-acc="${p.user_id}" ${p.role === "developer" ? "disabled" : ""}><option value="">None (sees nothing)</option>
        ${state.clients.map(c => `<option value="${c.id}" ${c.id === p.client_id ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select></td>
      <td><span class="msg" id="acc-${p.user_id}"></span></td></tr>`).join("");
  document.querySelectorAll("[data-acc]").forEach(sel => sel.addEventListener("change", async () => {
    const { error } = await db.from("profiles").update({ client_id: sel.value || null }).eq("user_id", sel.dataset.acc);
    setMsg("acc-" + sel.dataset.acc, error ? error.message : "Saved", error ? "bad" : "ok");
    if (!error) { const p = state.profiles.find(x => x.user_id === sel.dataset.acc); if (p) p.client_id = sel.value || null; }
  }));
}

// ───── Unbind requests ─────
async function renderUnbind() {
  const { data, error } = await db.from("unbind_requests").select("*").order("created_at", { ascending: false }).limit(100);
  if (error) { $("#unbindTable").innerHTML = `<tr><td>${esc(error.message)}</td></tr>`; return; }
  const name = id => { const u = state.units.find(x => x.id === id); return u ? unitName(u) + " · " + u.device_id : id; };
  $("#unbindTable").innerHTML = `<tr><th>When</th><th>Unit</th><th>Reason</th><th>Status</th>${state.dev ? "<th></th>" : ""}</tr>` +
    ((data || []).map(r => `<tr><td>${esc(dt(r.created_at))}</td><td>${esc(name(r.unit_id))}</td><td class="wrap-text">${esc(r.reason || "")}</td>
      <td><span class="pill ${r.status === "pending" ? "warn" : r.status === "rejected" ? "bad" : "ok"}">${esc(r.status)}</span></td>
      ${state.dev ? `<td>${r.status === "pending" ? `<button class="btn" data-ub="${r.id}" data-st="done">Done (unbound)</button> <button class="btn danger" data-ub="${r.id}" data-st="rejected">Reject</button>` : ""}</td>` : ""}</tr>`).join("")
      || `<tr><td colspan="5" class="muted">No requests.</td></tr>`);
  document.querySelectorAll("[data-ub]").forEach(b => b.addEventListener("click", async () => {
    b.disabled = true;
    const { error } = await db.from("unbind_requests").update({ status: b.dataset.st, decided_at: new Date().toISOString(), decided_by: state.me.id }).eq("id", b.dataset.ub);
    if (error) { b.disabled = false; b.textContent = error.message; } else renderUnbind();
  }));
}

boot();
</script>
</body>
</html>
